<!doctype html>
<!-- Source for public/og.jpg (1200x630). Regenerate: node scripts/og/render.mjs
     Copy mirrors src/data/site.ts (hero.h1, stats). Update both together. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'LS'; src: url('../../node_modules/@fontsource-variable/league-spartan/files/league-spartan-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0b0d0c; color: #fff; font-family: 'LS', sans-serif; position: relative; }
  .glow { position: absolute; left: -200px; bottom: -260px; width: 760px; height: 620px; background: radial-gradient(closest-side, rgba(23,217,122,.16), transparent); }
  .copy { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 640px; display: flex; flex-direction: column; }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  .wordmark span { color: #17d97a; }
  h1 { margin-top: auto; font-size: 66px; font-weight: 800; line-height: 1.02; letter-spacing: -0.01em; }
  .meta { margin-top: 34px; display: flex; align-items: center; gap: 22px; font-size: 24px; font-weight: 600; color: #e4e6e5; }
  .price { background: #17d97a; color: #0e0f0f; font-weight: 700; padding: 12px 20px 9px; border-radius: 10px; }
  .meta .dot { width: 10px; height: 10px; border-radius: 50%; background: #17d97a; display: inline-block; margin-right: 10px; vertical-align: 2px; }
  .photo { position: absolute; right: 0; top: 0; width: 400px; height: 630px; background: url('../../src/assets/sites/olievenhoutbosh-east.webp') 50% 14% / cover; }
  .photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0d0c 0%, rgba(11,13,12,0) 28%); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="photo"></div>
  <div class="copy">
    <div class="wordmark">Stella<span>Ads</span></div>
    <h1>Book premium billboard space with total confidence.</h1>
    <div class="meta"><span class="price">From R 7,000/mo excl. VAT</span><span><i class="dot"></i>Pretoria &amp; Centurion</span></div>
  </div>
</body></html>
