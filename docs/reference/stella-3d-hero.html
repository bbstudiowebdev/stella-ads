<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d0c;color:#fff;font-family:'League Spartan',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:#17D97A} a:hover{color:#2BEA8B}
  button{font-family:inherit}
  #stage{position:absolute;inset:0;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  #stage.hovering{cursor:pointer}
  #stage canvas{display:block}

  .copy{position:absolute;left:clamp(20px,5vw,64px);top:calc(50% - 40px);transform:translateY(-50%);max-width:min(520px,42vw);display:flex;flex-direction:column;gap:22px;pointer-events:none;transition:opacity 400ms,transform 400ms}
  .copy.hide{opacity:0;transform:translateY(-50%) translateX(-24px)}
  .copy h1{margin:0;font-size:clamp(40px,5.2vw,68px);font-weight:800;line-height:1.02;letter-spacing:-0.01em;text-wrap:balance}
  .copy p{margin:0;font-size:clamp(17px,1.5vw,20px);color:#e4e6e5;line-height:1.5}
  .ctas{display:flex;flex-wrap:wrap;align-items:center;gap:28px;pointer-events:auto}
  .btn{background:#17D97A;color:#0e0f0f;border:0;font-weight:700;font-size:16px;padding:16px 28px;border-radius:10px;cursor:pointer;text-decoration:none;transition:background 160ms,transform 160ms}
  .btn:hover{background:#2BEA8B;color:#0e0f0f;transform:translateY(-1px)}
  .btn:focus-visible,.chip:focus-visible,.close:focus-visible,.link:focus-visible{outline:3px solid #17D97A;outline-offset:3px}
  .link{background:none;border:0;color:#fff;font-weight:600;font-size:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.4);cursor:pointer;transition:border-color 160ms}
  .link:hover{border-color:#17D97A}

  .dock.shift{right:calc(min(400px,100% - 32px) + 40px)}
  @media (max-width:760px){.dock.shift{opacity:0;pointer-events:none}}
  .dock{transition:opacity 300ms;position:absolute;left:clamp(20px,5vw,64px);right:clamp(20px,5vw,64px);bottom:clamp(20px,4vh,36px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
  .chip{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid #333735;background:#141716;color:#e4e6e5;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 160ms}
  .chip:hover{border-color:#6b6e6c;color:#fff}
  .chip.on{background:#fff;color:#0e0f0f;border-color:#fff}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:20px;font-size:13px;color:#b4b7b5}
  .lg{display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:#17D97A;display:inline-block}
  .dot.off{background:#8a8d8b}

  .labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .city{position:absolute;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#9fb3a9;transform:translate(-50%,-50%);white-space:nowrap;transition:opacity 200ms}
  .tip{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:#fff;color:#0e0f0f;font-size:13px;font-weight:700;padding:7px 10px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity 120ms}
  .tip.show{opacity:1}

  .panel{position:absolute;top:16px;right:16px;bottom:16px;width:min(400px,calc(100% - 32px));background:#121514;border:1px solid #262a28;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform 480ms cubic-bezier(.2,.8,.2,1)}
  .panel.open{transform:none}
  .photo{position:relative;aspect-ratio:16/10;max-height:42%;background:#1c201e;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:12px;color:#8a8d8b;flex:none}
  .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:10px;border:0;background:#0e0f0f;color:#fff;font-size:22px;line-height:1;cursor:pointer}
  .close:hover{background:#262a28}
  .pbody{padding:24px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1}
  .pbody>*{flex:none}
  .status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#e4e6e5}
  .pbody h2{margin:10px 0 0;font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-0.01em}
  .muted{font-size:15px;color:#b4b7b5}
  .facts{margin:18px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#262a28;border:1px solid #262a28;border-radius:12px;overflow:hidden}
  .fact{background:#121514;padding:14px}
  .fact dt{font-size:12.5px;color:#9a9d9b}
  .fact dd{margin:4px 0 0;font-size:17px;font-weight:700}
  .fact.wide{grid-column:1/-1}
  .pbody .btn{margin-top:auto;text-align:center}
  .pnav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
  .pnav button{flex:1;min-height:44px;border-radius:9px;border:1px solid #333735;background:transparent;color:#e4e6e5;font-size:14px;font-weight:600;cursor:pointer}
  .pnav button:hover{border-color:#6b6e6c;color:#fff}

  .loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6e6c;pointer-events:none;transition:opacity 400ms}

  @media (max-width:760px){
    .copy{top:24px;transform:none;max-width:none;right:20px;gap:14px}
    .copy.hide{transform:translateY(-12px)}
    .copy h1{font-size:34px}
    .copy p{font-size:16px}
    .btn{padding:14px 22px}
    .meta .hint{display:none}
    .panel{top:auto;left:0;right:0;bottom:0;width:100%;height:64%;border-radius:18px 18px 0 0;transform:translateY(105%)}
    .photo{aspect-ratio:auto;height:200px}
    .pbody h2{font-size:24px}
  }
</style>
</head>
<body>
<div id="stage" aria-label="Interactive 3D globe showing Stella Ads billboard locations. Drag to rotate, scroll to zoom." role="application"></div>
<div class="labels" id="labels"><div class="tip" id="tip"></div></div>
<div class="loader" id="loader">Loading network</div>

<div class="copy" id="copy">
  <h1>Book premium billboard space with total confidence.</h1>
  <p>Find it, book it, pay for it all in one place.</p>
  <div class="ctas">
    <button class="btn" id="ctaQuote">Get a quote</button>
    <button class="link" id="ctaBrowse">Browse billboards →</button>
  </div>
</div>

<div class="dock" id="dock">
  <div class="chips" id="chips"></div>
  <div class="meta">
    <span class="lg"><span class="dot"></span>Available</span>
    <span class="lg"><span class="dot off"></span>Occupied</span>
    <span class="hint">Drag to rotate · Scroll to zoom · Tap a pin</span>
  </div>
</div>

<aside class="panel" id="panel" aria-hidden="true" aria-labelledby="pName">
  <div class="photo"><span id="pPhotoEmpty">drone photo</span><img id="pPhoto" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#0e0f0f;display:none"><button style="z-index:1" class="close" id="pClose" aria-label="Close details">×</button></div>
  <div class="pbody">
    <div class="status"><span class="dot" id="pDot"></span><span id="pStatus"></span></div>
    <h2 id="pName"></h2>
    <div class="muted" id="pCity"></div>
    <dl class="facts">
      <div class="fact"><dt>Daily traffic</dt><dd id="pTraffic"></dd></div>
      <div class="fact"><dt>Rental</dt><dd id="pPrice"></dd></div>
      <div class="fact wide"><dt>GPS</dt><dd id="pGps"></dd></div>
    </dl>
    <button class="btn" id="pQuote">Request a quote</button>
    <div class="pnav"><button id="pPrev">← Previous site</button><button id="pNext">Next site →</button></div>
  </div>
</aside>

  panel.classList.remove('open'); $('dock').classList.remove('shift'); panel.setAttribute('aria-hidden', 'true'); copy.classList.remove('hide');
  if (back && returnTo) flyTo(returnTo.pos, returnTo.pos.length(), 1300);
  returnTo = null;
}
$('pClose').onclick = () => closePanel();
$('pNext').onclick = () => openPin((selected + 1) % pins.length);
$('pPrev').onclick = () => openPin((selected - 1 + pins.length) % pins.length);
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

function send(type, extra) {
  if (inFrame) window.parent.postMessage({ type, ...extra }, '*');
  else location.href = './Stella%20Ads%20Landing%20Page%20v3.dc.html#' + (type === 'stella-browse' ? 'billboards' : 'quote');
}
$('pQuote').onclick = () => send('stella-enquire', { name: pins[selected]?.b.name || '' });
$('ctaQuote').onclick = () => send('stella-enquire', { name: '' });
$('ctaBrowse').onclick = () => send('stella-browse');

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null, hoverIdx = -1;
function pick(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(hitTargets.filter(h => h.visible), false);
  if (!hits.length) return -1;
  const g = ray.intersectObject(sphere, false)[0];
  if (g && g.distance < hits[0].distance - 0.0005 && camera.position.length() > 1.2) return -1;
  return hits[0].object.userData.index;
}
let introTimers = [];
const cancelIntro = () => { introTimers.forEach(clearTimeout); introTimers = []; };
renderer.domElement.addEventListener('pointerdown', e => {
  downAt = { x: e.clientX, y: e.clientY };
  stage.classList.add('dragging');
  if (fly && !fly.done) { fly = null; controls.enabled = true; controls.update(); }
  cancelIntro();
});
addEventListener('pointerup', e => {
  stage.classList.remove('dragging');
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y); downAt = null;
  if (moved > 6) { if (activeView) { activeView = null; renderChips(); } return; }
  const i = pick(e.clientX, e.clientY);
  if (i >= 0) openPin(i);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (downAt) return;
  hoverIdx = pick(e.clientX, e.clientY);
  stage.classList.toggle('hovering', hoverIdx >= 0);
});
renderer.domElement.addEventListener('pointerleave', () => { hoverIdx = -1; stage.classList.remove('hovering'); });
renderer.domElement.addEventListener('wheel', () => { cancelIntro(); if (activeView) { activeView = null; renderChips(); } }, { passive: true });

const intro = { t0: 0, popDur: reduced ? 1 : 1100 };
function dropPins(delay = 0) {
  pins.forEach((p, k) => {
    p.drop = { t0: performance.now() + delay + (reduced ? 0 : k * 110), dur: reduced ? 1 : 900 };
    p.body.visible = true;
  });
}
function startIntro() {
  intro.t0 = performance.now();
  camera.position.copy(ll(8, -10).multiplyScalar(4.2));
  camera.lookAt(0, 0, 0);
  if (reduced) { globe.scale.setScalar(1); dropPins(); goView('gauteng', 1); return; }
  introTimers.push(setTimeout(() => flyTo(ll(-29, 25.5), 2.3, 1900), 350));
  introTimers.push(setTimeout(() => dropPins(), 2050));
  introTimers.push(setTimeout(() => goView('gauteng', 2100), 3500));
  activeView = 'gauteng'; renderChips();
}

const v3 = new THREE.Vector3(), camDir = new THREE.Vector3();
function project(v) { v3.copy(v).project(camera); return { x: (v3.x * 0.5 + 0.5) * W, y: (-v3.y * 0.5 + 0.5) * H, z: v3.z }; }
function frame(now) {
  requestAnimationFrame(frame);
  const pk = Math.min(1, (now - intro.t0) / intro.popDur);
  globe.scale.setScalar(Math.max(0.001, easeBack(pk)));
  rim.scale.copy(globe.scale);
  if (fly) stepFly(now); else controls.update();
  const d = camera.position.length();
  controls.rotateSpeed = Math.min(0.6, Math.max(0.025, (d - 1) * 0.45));
  off.x += (offT.x - off.x) * 0.08; off.y += (offT.y - off.y) * 0.08;
  camera.setViewOffset(W, H, off.x, off.y, W, H);
  rim.quaternion.copy(camera.quaternion);
  rim.visible = d > 1.4;

  const s = Math.max(0.00022, (d - 1) * 0.0092);
  camDir.copy(camera.position).normalize();
  const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const gs = globe.scale.x;
  pins.forEach((p, i) => {
    const sel = i === selected, hov = i === hoverIdx;
    const k2 = sel ? 1.3 : hov ? 1.15 : 1;
    p.g.scale.setScalar(s * k2);
    if (p.drop) {
      const k = Math.min(1, Math.max(0, (now - p.drop.t0) / p.drop.dur));
      p.lift = 1 - bounce(k);
      p.head.visible = now >= p.drop.t0;
      p.base.visible = k > 0.4;
    }
    const sz = s * 3.6 * k2;
    p.head.scale.set(sz * 0.8, sz, 1);
    p.head.position.copy(p.n).multiplyScalar(1.0006 * gs).addScaledVector(camUp, p.lift * s * 22);
  });

  const showCities = d < 1.6;
  cityEls.forEach(c => {
    const facing = c.v.clone().normalize().dot(camDir) > 0.2;
    const pt = project(c.v);
    const on = showCities && facing && pt.z < 1;
    c.el.style.opacity = on ? 1 : 0;
    if (on) { c.el.style.left = pt.x + 'px'; c.el.style.top = (pt.y + 18) + 'px'; }
  });
  const ti = hoverIdx >= 0 ? hoverIdx : -1;
  if (ti >= 0 && ti !== selected) {
    const p = pins[ti], w = p.head.position.clone().addScaledVector(camUp, p.head.scale.y);
    const pt = project(w);
    tip.textContent = p.b.name; tip.style.left = pt.x + 'px'; tip.style.top = (pt.y + 4) + 'px'; tip.classList.add('show');
  } else tip.classList.remove('show');

  renderer.render(scene, camera);
}

buildEarth().catch(err => console.warn('Map data failed to load', err)).finally(() => {
  $('loader').style.opacity = 0;
  startIntro();
});
requestAnimationFrame(frame);
</script>
